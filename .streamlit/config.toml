[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f3f3f1"
textColor = "#1d1f22"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Source Serif 4:https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap, serif"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap, monospace"
headingFontWeights = [600, 600, 600, 600, 600, 600]
baseRadius = "0.6rem"
borderColor = "#e5e5e1"
showSidebarBorder = true
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#4a3aa7", "#8a8a85"]

[theme.sidebar]
backgroundColor = "#f6f6f4"
